name: Build and Release

on:
  push:
    tags:
      - 'v*'  # v1.0.0 のようなタグでトリガー
  workflow_dispatch:  # 手動実行も可能

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Install test tools
      run: |
        pip install pytest==9.1.1

    # タグを打てば中身に関わらず公開されていた。ここを門番にする。
    - name: Run tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python -m pytest -q

    # 版がずれると、更新の判定と表示がずれた配布物が出る。
    - name: Check version consistency
      id: version
      shell: pwsh
      run: |
        $line = Select-String -Path src/__version__.py `
                              -Pattern '__version__\s*=\s*"([^"]+)"'
        if (-not $line) { throw '__version__ を読めません' }
        $version = $line.Matches[0].Groups[1].Value
        Write-Host "__version__ = $version"

        if (-not (Select-String -Path CHANGELOG.md -SimpleMatch "## [$version]")) {
          throw "CHANGELOG.md に [$version] の節がありません"
        }

        if ($env:GITHUB_REF -like 'refs/tags/*') {
          $tag = $env:GITHUB_REF_NAME
          if ($tag -ne "v$version") {
            throw "タグ $tag と __version__ $version が食い違っています"
          }
        }
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Generate third-party notices
      run: |
        python tools/gen_third_party_notices.py > THIRD-PARTY-NOTICES.txt

    - name: Build executable
      run: |
        python -m PyInstaller --clean NetBelt.spec
        
    - name: Create portable package
      run: |
        mkdir portable
        copy dist\NetBelt.exe portable\
        copy README.md portable\README.txt
        copy LICENSE portable\LICENSE.txt
        copy THIRD-PARTY-NOTICES.txt portable\
        copy updater.bat portable\
        copy CHANGELOG.md portable\CHANGELOG.txt
        
        REM MIBファイルもコピー
        xcopy /E /I mibs portable\mibs
      shell: cmd
        
    - name: Create ZIP archive
      run: |
        # タグではなく __version__ を使う。タグ以外で手動実行すると
        # ブランチ名が入り、スラッシュでファイル名が壊れていた。
        $version = "${{ steps.version.outputs.version }}"
        $zipName = "NetBelt-v${version}-Windows-Portable.zip"
        Compress-Archive -Path portable\* -DestinationPath $zipName
        # 自動更新がダウンロード後に照合するチェックサム
        $hash = (Get-FileHash -Algorithm SHA256 -Path $zipName).Hash.ToLower()
        "$hash  $zipName" | Out-File -FilePath "$zipName.sha256" -Encoding ascii -NoNewline
        Write-Host "SHA-256: $hash"
      shell: pwsh
        
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: NetBelt-Portable
        path: NetBelt-v*-Windows-Portable.zip
        
    # 更新の通知はリリース本文をそのまま出す。案内文だけだと、利用者は
    # 何が変わったのか分からない。CHANGELOG のこの版の節を先頭へ置き、
    # 案内文 (.github/release-body.md) をその下へ続ける。
    - name: Build release notes
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        $version = '${{ steps.version.outputs.version }}'
        $lines = Get-Content CHANGELOG.md -Encoding utf8
        $start = $null
        $end = $lines.Count
        # -like は [ ] を文字クラスとして解釈するので使えない。
        # "## [1.2.0]*" は「1 . 2 0 のどれか1文字」という意味になり一致しない
        for ($i = 0; $i -lt $lines.Count; $i++) {
          if ($lines[$i].StartsWith("## [$version]")) { $start = $i + 1; continue }
          if ($null -ne $start -and $lines[$i].StartsWith('## [')) { $end = $i; break }
        }
        if ($null -eq $start) { throw "CHANGELOG.md に [$version] の節がありません" }
        $section = ($lines[$start..($end - 1)] -join "`n").Trim()
        if (-not $section) { throw "[$version] の節が空です" }

        $template = (Get-Content .github/release-body.md -Encoding utf8) -join "`n"
        $template = $template.Replace('{{TAG}}', $env:GITHUB_REF_NAME)

        $body = "## v$version で変わったこと`n`n$section`n`n---`n`n$template"
        Set-Content -Path release_notes.md -Value $body -Encoding utf8
        Write-Host "本文 $($body.Length) 文字 (うち変更点 $($section.Length) 文字)"

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: |
          NetBelt-v*-Windows-Portable.zip
          NetBelt-v*-Windows-Portable.zip.sha256
        body_path: release_notes.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}